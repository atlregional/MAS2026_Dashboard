# 1 = show the year-over-year trend line charts, 0 = don't. Use the mapping
# form to also limit the line charts to start_year onward (the bar charts
# still offer every year), e.g. bigprob below, or to only draw some
# responses' lines with trend_responses (raw or display names), e.g. emerg.
question_hist:
  bigprob:
    trend: 1
    start_year: 2025
  lkahead: 1
  emerg:
    trend: 1
    trend_responses:
      - Sell or Pawn
      - Borrow Someone's Money
      - Not Able to Get Money
  finances: 1
  finhous: 0
  finjobopp: 0
  fintrans: 0
  finassis: 0
  finjobtrain: 0
  finbank: 0
  finchldcare: 0
  finparntcare: 0
  sclincdiff: 0
  supphousduplx: 0
  supphoustriplx: 0
  supphoussmapt: 0
  supphoustnyhm: 0
  supphousbckyrdapt: 0
  supphoussubapt: 0
  skiptrip: 0
  joboppcommute: 0
  ideatransp: 0

