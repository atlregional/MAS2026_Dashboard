# Groups still shown in the bar charts but with no historic trend line chart
# (raw group values, before demo_grp_rename). Race: multiracial is only its
# own group from 2026 (before that it's counted in other), so neither has a
# consistent trend.
excluded_historical:
  Race:
  - multiracial
  - other
# Extra sentence added to the end of the note under a demographic's bar chart
# (all years), keyed by the demo_col_map label.
demo_notes:
  Race: "In 2025 and earlier, the Other group includes Multiracial respondents. Starting in 2026, Multiracial is broken out of the Other group."
